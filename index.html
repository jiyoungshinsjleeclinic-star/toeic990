<style>
:root{--blue:#2563eb;--green:#16a34a;--bg:#f6f8fc;--ink:#172033;--muted:#6b7280;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.streak{background:#fff1e8;border:1px solid #fed7aa;border-radius:999px;padding:8px 10px;font-weight:700;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{border:0;background:#e9eef9;padding:11px 6px;border-radius:12px;font-weight:700}.tab.active{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.day{font-weight:800;color:var(--blue);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;overflow:hidden;margin:10px 0 22px}.progress i{display:block;height:100%;background:var(--blue)}
.wordrow{display:flex;justify-content:space-between;gap:8px;align-items:start}.word{font-size:34px;font-weight:900;line-height:1.15;word-break:break-word}.star{border:0;background:#fff7cc;border-radius:12px;font-size:20px;padding:7px 10px}
.btn{width:100%;padding:14px 13px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:15px;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.green{background:#eaf8ef;color:#147a37;border-color:#b8e7c6}.btn.soft{background:#f3f6fb}
.meaning{margin-top:14px;padding:16px;background:#eff6ff;border-radius:15px}.meaning b{font-size:18px}.example{margin-top:15px;padding:14px;background:#f9fafb;border-radius:14px;line-height:1.55}.ko{color:#526071;margin-top:6px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.hidden{display:none!important}
.quizq{font-weight:800;font-size:18px;margin-bottom:12px}.choice{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#fff}.choice.ok{background:#eaf8ef;border-color:#62c87a}.choice.bad{background:#fff1f2;border-color:#fb7185}
.small{font-size:13px;color:var(--muted);line-height:1.55}.history{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.d{background:#eef2f7;border-radius:10px;text-align:center;padding:8px 2px;font-size:11px}.d.done{background:#dcfce7;color:#166534;font-weight:800}.reviewItem{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.reviewItem b{font-size:17px}
.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);text-align:center}
.micstatus{margin-top:8px;font-size:13px;text-align:center;color:var(--muted)}

.wordtoken{display:inline-block;border-bottom:1px dashed #94a3b8;cursor:pointer;padding:0 1px}
.wordtoken:active{background:#dbeafe}
.speakbox{margin-top:14px;padding:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px}
.speakbox b{display:block;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9999}
.modalbox{width:min(560px,100%);background:white;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.modalword{font-size:30px;font-weight:900;margin-bottom:8px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><h1>🏆 TOEIC 990</h1><p>TOEIC 990 목표 · 매일 5단어 + 말하기</p></div><div class="streak" id="streak">🔥 0일</div></div>
  <div class="tabs">

</div>

<div id="wordModal" class="modal hidden" onclick="if(event.target.id==='wordModal')closeWordModal()">

</div>

<div class="footer">🔊 영어 듣기 · 🎤 단어/예문 말하기 · 📘 예문 단어 검색 · 매일 자동 업데이트</div>
<script>
const WORDS = [{"w": "agenda", "m": "안건, 의제", "e": "Please review the agenda before the meeting.", "k": "회의 전에 안건을 검토해 주세요."}, {"w": "attend", "m": "참석하다", "e": "All managers must attend the quarterly meeting.", "k": "모든 관리자는 분기 회의에 참석해야 합니다."}, {"w": "postpone", "m": "연기하다", "e": "We decided to postpone the presentation until Friday.", "k": "우리는 발표를 금요일로 연기하기로 했습니다."}, {"w": "reschedule", "m": "일정을 변경하다", "e": "Could you reschedule the interview for next week?", "k": "면접을 다음 주로 변경해 주실 수 있나요?"}, {"w": "minutes", "m": "회의록", "e": "The assistant will send the minutes by email.", "k": "비서가 회의록을 이메일로 보낼 것입니다."}, {"w": "participant", "m": "참가자", "e": "Each participant received a printed handout.", "k": "각 참가자는 인쇄된 자료를 받았습니다."}, {"w": "conference", "m": "회의, 학회", "e": "The annual conference will be held in Busan.", "k": "연례 회의는 부산에서 열립니다."}, {"w": "schedule", "m": "일정, 예정하다", "e": "The schedule for the training has been updated.", "k": "교육 일정이 업데이트되었습니다."}, {"w": "appointment", "m": "약속, 예약", "e": "I have an appointment with the client at three.", "k": "저는 3시에 고객과 약속이 있습니다."}, {"w": "confirm", "m": "확인하다", "e": "Please confirm your attendance by Wednesday.", "k": "수요일까지 참석 여부를 확인해 주세요."}, {"w": "remind", "m": "상기시키다", "e": "Let me remind you that the deadline is tomorrow.", "k": "마감이 내일이라는 점을 알려 드립니다."}, {"w": "notify", "m": "통지하다", "e": "We will notify all staff of the schedule change.", "k": "일정 변경을 전 직원에게 통지하겠습니다."}, {"w": "announce", "m": "발표하다", "e": "The director announced a new office policy.", "k": "이사가 새로운 사무실 정책을 발표했습니다."}, {"w": "announcement", "m": "공지, 발표", "e": "An announcement was posted on the bulletin board.", "k": "게시판에 공지가 붙었습니다."}, {"w": "attachment", "m": "첨부 파일", "e": "The report is included as an attachment.", "k": "보고서는 첨부 파일로 포함되어 있습니다."}, {"w": "forward", "m": "전달하다", "e": "Could you forward the email to the sales team?", "k": "그 이메일을 영업팀에 전달해 주시겠어요?"}, {"w": "reply", "m": "답장하다, 답장", "e": "She sent a quick reply to the customer.", "k": "그녀는 고객에게 빠른 답장을 보냈습니다."}, {"w": "regarding", "m": "~에 관하여", "e": "I am writing regarding your recent inquiry.", "k": "귀하의 최근 문의에 관하여 글을 씁니다."}, {"w": "recipient", "m": "수신자", "e": "The recipient of the message was on vacation.", "k": "그 메시지의 수신자는 휴가 중이었습니다."}, {"w": "urgent", "m": "긴급한", "e": "This is an urgent request from the head office.", "k": "이것은 본사의 긴급한 요청입니다."}, {"w": "available", "m": "이용 가능한, 시간이 있는", "e": "Is the conference room available at noon?", "k": "회의실이 정오에 이용 가능한가요?"}, {"w": "confidential", "m": "기밀의", "e": "All salary data is strictly confidential.", "k": "모든 급여 자료는 엄격히 기밀입니다."}, {"w": "distribute", "m": "배포하다", "e": "Please distribute the handouts to the guests.", "k": "손님들에게 자료를 배포해 주세요."}, {"w": "summarize", "m": "요약하다", "e": "Could you summarize the results in one page?", "k": "결과를 한 페이지로 요약해 주시겠어요?"}, {"w": "clarify", "m": "명확히 하다", "e": "Let me clarify the terms of the agreement.", "k": "계약 조건을 명확히 하겠습니다."}, {"w": "discuss", "m": "논의하다", "e": "We will discuss the budget this afternoon.", "k": "우리는 오늘 오후에 예산을 논의할 것입니다."}, {"w": "agree", "m": "동의하다", "e": "Both sides agree on the delivery date.", "k": "양측은 배송 날짜에 동의합니다."}, {"w": "suggestion", "m": "제안", "e": "Her suggestion improved the whole process.", "k": "그녀의 제안이 전체 과정을 개선했습니다."}, {"w": "proposal", "m": "제안서", "e": "The client accepted our project proposal.", "k": "고객이 우리 프로젝트 제안서를 수락했습니다."}, {"w": "deadline", "m": "기한", "e": "The deadline for the draft is Monday morning.", "k": "초안 기한은 월요일 오전입니다."}, {"w": "submit", "m": "제출하다", "e": "Please submit your expense report by Friday.", "k": "금요일까지 경비 보고서를 제출해 주세요."}, {"w": "revise", "m": "수정하다", "e": "We need to revise the slides before the demo.", "k": "시연 전에 슬라이드를 수정해야 합니다."}, {"w": "draft", "m": "초안", "e": "Send me a draft of the contract today.", "k": "오늘 계약서 초안을 보내 주세요."}, {"w": "handout", "m": "배포 자료", "e": "The handout explains each step clearly.", "k": "배포 자료는 각 단계를 명확히 설명합니다."}, {"w": "venue", "m": "장소", "e": "The venue for the workshop has c function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exampleClickable(sentence){

    if(/^\s+$/.test(tok)) return tok;
    const clean=tok.replace(/^[^A-Za-z]+|[^A-Za-z'-]+$/g,'');
    if(!clean) return escapeHtml(tok);
    const pos=tok.indexOf(clean), before=tok.slice(0,pos), after=tok.slice(pos+clean.length);

}

let VOICES=[];
function refreshVoices(){

  VOICES = window.speechSynthesis.getVoices() || [];

function speak(text){
  if(!('speechSynthesis' in window)){
    alert('현재 브라우저에서는 음성 재생을 지원하지 않습니다. Chrome 또는 Samsung Internet에서 열어 주세요.');
    return;
  }
  const synth = window.speechSynthesis;
  synth.cancel();
  synth.resume();
  refreshVoices();

  const play = () => {
    const u = new SpeechSynthesisUtterance(text);
    const vs = VOICES.length ? VOICES : (synth.getVoices() || []);
    const preferred =
      vs.find(v => /en-US/i.test(v.lang) && /google|samsung|microsoft/i.test(v.name)) ||
      vs.find(v => /en-US/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) ||
      null;
    if(preferred) u.voice = preferred;
    u.lang = preferred?.lang || 'en-US';
    u.rate = 0.88;
    u.volume = 1;
    u.pitch = 1;
    u.onerror = () => {
      alert('음성 재생이 차단되었습니다. 이 파일을 Chrome 또는 Samsung Internet에서 직접 열어 주세요.');
    };
    synth.speak(u);
  };

  // Android browsers sometimes expose voices only after a user gesture / short delay.
  if((synth.getVoices() || []).length === 0){
    setTimeout(() => { refreshVoices(); play(); }, 150);
  } else {
    play();
  }
}

 document.getElementById('wordArea').innerHTML=`
 <div class="wordrow"><div class="word">${w.w}</div><button class="star" onclick="star(${w._i})">${isStar?'⭐':'☆'}</button></div>
 <button class="btn primary" onclick='speak(${JSON.stringify(w.w)})'>🔊 발음 듣기</button>
 <button class="btn green" onclick="recognition()">🎤 3번 말하기 · ${c}/3 ${c>=3?'🎉':''}</button>
 <div id="micstatus" class="micstatus">${c?`${c}회 완료${c>=3?' · 좋아요!':''}`:'영어로 3번 말해보세요.'}</div>
 ${revealed[idx]?`<div class="meaning"><b>🇰🇷 ${w.m}</b><div class="example"><div>${exampleClickable(w.e)}</div><button class="btn soft" onclick='speak(${JSON.stringify(w.e)})'>🔊 예문 듣기</button><div class="ko">${w.k}</div><div class="small" style="margin-top:8px">💡 모르는 영어 단어를 누르면 발음 듣기와 사전 검색을 할 수 있어요.</div></div><div class="speakbox"><b>🗣️ 매일 말하기</b><div class="small">예문을 듣고 그대로 3번 따라 말해보세요.</div><button class="btn green" onclick="sentenceSpeakPractice()">🎤 예문 3번 말하기 · ${sentenceCount[idx]||0}/3 ${(sentenceCount[idx]||0)>=3?'🎉':''}</button><div class="small" style="margin-top:10px">그 다음, 이 단어를 사용해 짧은 영어 문장을 직접 만들어 말해보세요.</div><button class="btn" onclick="dailyAnswerPractice()">💬 자유 문장 말하기</button><div id="answerStatus" class="micstatus">자유 말하기 ${answerCount[idx]||0}/3</div></div></div>`:`<button class="btn soft" onclick="revealed[${idx}]=true;renderWord()">뜻 보기 👀</button>`}
 <div class="nav"><button class="btn" ${idx===0?'disabled':''} onclick="idx--;renderWord()">← 이전</button><button class="btn primary" onclick="${idx<4?'idx++;renderWord()':'startQuiz()'}">${idx<4?'다음 →':'5문제 퀴즈 →'}</button></div>`;
}
function shuffle(a,seed){let r=seeded(seed),x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startQuiz(){quizIndex=0;quizScore=0;quizWrong=[];document.getElementById('learnCard').classList.add('hidden');document.getElementById('quizCard').classList.remove('hidden');renderQuiz()}
function renderQuiz(){
 let box=document.getElementById('quizCard');
 if(quizIndex>=5){box.innerHTML=`<h2>🎉 오늘 학습 완료</h2><p style="font-size:28px;font-weight:900">${quizScore} / 5</p><p>${quizWrong.length?'틀린 단어는 자동으로 복습 단어장에 저장했어요.':'모두 맞았어요! 훌륭합니다.'}</p><button class="btn primary" onclick="finishDay()">학습 완료 ✓</button>`;return}
 let w=TODAY[quizIndex], others=WORDS.filter((_,i)=>i!==w._i).map(x=>x.m), opts=shuffle([w.m,...shuffle(others,dayNum()*97+quizIndex).slice(0,3)],dayNum()*113+quizIndex);
 box.innerHTML=`<div class="day">QUIZ ${quizIndex+1}/5</div><div class="quizq" style="margin-top:18px">“${w.w}”의 뜻은?</div><div id="choices">${opts.map(o=>`<button class="choice" onclick='answer(${JSON.stringify(o)},this)'>${o}</button>`).join('')}</div>`;
}
function answer(o,el){let w=TODAY[quizIndex],ok=o===w.m;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);el.classList.add(ok?'ok':'bad');if(ok)quizScore++;else{quizWrong.push(w._i);state.wrong=[...new Set([...(state.wrong||[]),w._i])];save()}setTimeout(()=>{quizIndex++;renderQuiz()},650)}
function finishDay(){let d=seoulDate();state.done=[...new Set([...(state.done||[]),d])];save();updateStreak();document.getElementById('quizCard').innerHTML=`<h2>✅ ${d} 학습 완료</h2><p>내일 접속하면 새로운 오늘의 5단어가 자동으로 나옵니다.</p><button class="btn" onclick="idx=0;document.getElementById('quizCard').classList.add('hidden');document.getElementById('learnCard').classList.remove('hidden');renderWord()">오늘 단어 다시 보기</button>`}
function streak(){let s=new Set(state.done||[]),d=new Date(seoulDate()+'T00:00:00Z'),n=0;if(!s.has(seoulDate()))d.setUTCDate(d.getUTCDate()-1);while(s.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function updateStreak(){document.getElementById('streak').textContent='🔥 '+streak()+'일'}
function renderReview(){let ids=[...new Set([...(state.wrong||[]),...(state.stars||[])])];let el=document.getElementById('reviewList');if(!ids.length){el.innerHTML='<p class="small">아직 복습 단어가 없습니다. ⭐를 누르거나 퀴즈에서 틀린 단어가 여기에 저장됩니다.</p>';return}el.innerHTML=ids.map(i=>`<div class="reviewItem"><div style="flex:1"><b>${WORDS[i].w}</b><div class="small">${WORDS[i].m}</div><div class="small" style="margin-top:4px">${exampleClickable(WORDS[i].e)}</div></div><button class="star" onclick='speak(${JSON.stringify(WORDS[i].w)})'>🔊</button></div>`).join('')}
function renderHistory(){document.getElementById('historySummary').innerHTML=`<p><b>총 학습일</b> ${(state.done||[]).length}일 · <b>연속</b> ${streak()}일</p>`;let base=new Date(seoulDate()+'T00:00:00Z'),done=new Set(state.done||[]),arr=[];for(let i=6;i>=0;i--){let d=new Date(base);d.setUTCDate(d.getUTCDate()-i);let ds=d.toISOString().slice(0,10);arr.push(`<div class="d ${done.has(ds)?'done':''}">${d.getUTCMonth()+1}/${d.getUTCDate()}<br>${done.has(ds)?'✓':'·'}</div>`)}document.getElementById('history7').innerHTML=arr.join('')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['learn','review','history'].forEach(p=>document.getElementById(p+'Page').classList.toggle('hidden',p!==b.dataset.page));if(b.dataset.page==='review')renderReview();if(b.dataset.page==='history')renderHistory()});
updateStreak();renderWord();
</script>
</body></html>
