.meaning{margin-top:13px;padding:15px;background:#eff6ff;border-radius:15px}.meaning b{font-size:18px}.example{margin-top:13px;background:#f8fafc;padding:13px;border-radius:13px;line-height:1.55}.ko{color:#526071;margin-top:6px}.wordtoken{border-bottom:1px dashed #94a3b8;cursor:pointer}

<script>
const CURATED = [{"w": "agenda", "m": "안건, 의제", "e": "Please review the agenda before the meeting.", "k": "회의 전에 안건을 검토해 주세요."}, {"w": "attend", "m": "참석하다", "e": "All managers must attend the quarterly meeting.", "k": "모든 관리자는 분기 회의에 참석해야 합니다."}, {"w": "postpone", "m": "연기하다", "e": "We decided to postpone the presentation until Friday.", "k": "우리는 발표를 금요일로 연기하기로 했습니다."}, {"w": "reschedule", "m": "일정을 변경하다", "e": "Could you reschedule the interview for next week?", "k": "면접을 다음 주로 변경해 주실 수 있나요?"}, {"w": "minutes", "m": "회의록", "e": "The assistant will send the minutes by email.", "k": "비서가 회의록을 이메일로 보낼 것입니다."}, {"w": "participant", "m": "참가자", "e": "Each participant received a printed handout.", "k": "각 참가자는 인쇄된 자료를 받았습니다."}, {"w": "conference", "m": "회의, 학회", "e": "The annual conference will be held in Busan.", "k": "연례 회의는 부산에서 열립니다."}, {"w": "schedule", "m": "일정, 예정하다", "e": "The schedule for the training has been updated.", "k": "교육 일정이 업데이트되었습니다."}, {"w": "appointment", "m": "약속, 예약", "e": "I have an appointment with the client at three.", "k": "저는 3시에 고객과 약속이 있습니다."}, {"w": "confirm", "m": "확인하다", "e": "Please confirm your attendance by Wednesday.", "k": "수요일까지 참석 여부를 확인해 주세요."}, {"w": "remind", "m": "상기시키다", "e": "Let me remind you that the deadline is tomorrow.", "k": "마감이 내일이라는 점을 알려 드립니다."}, {"w": "notify", "m": "통지하다", "e": "We will notify all staff of the schedule change.", "k": "일정 변경을 전 직원에게 통지하겠습니다."}, {"w": "announce", "m": "발표하다", "e": "The director announced a new office policy.", "k": "이사가 새로운 사무실 정책을 발표했습니다."}, {"w": "announcement", "m": "공지, 발표", "e": "An announcement was posted on the bulletin board.", "k": "게시판에 공지가 붙었습니다."}, {"w": "attachment", "m": "첨부 파일", "e": "The report is included as an attachment.", "k": "보고서는 첨부 파일로 포함되어 있습니다."}, {"w": "forward", "m": "전달하다", "e": "Could you forward the email to the sales team?", "k": "그 이메일을 영업팀에 전달해 주시겠어요?"}, {"w": "reply", "m": "답장하다, 답장", "e": "She sent a quick reply to the customer.", "k": "그녀는 고객에게 빠른 답장을 보냈습니다."}, {"w": "regarding", "m": "~에 관하여", "e": "I am writing regarding your recent inquiry.", "k": "귀하의 최근 문의에 관하여 글을 씁니다."}, {"w": "recipient", "m": "수신자", "e": "The recipient of the message was on vacation.", "k": "그 메시지의 수신자는 휴가 중이었습니다."}, {"w": "urgent", "m": "긴급한", "e": "This is an urgent request from the head office.", "k": "이것은 본사의 긴급한 요청입니다."}, {"w": "available", "m": "이용 가능한, 시간이 있는", "e": "Is the conference room available at noon?", "k": "회의실이 정오에 이용 가능한가요?"}, {"w": "confidential", "m": "기밀의", "e": "All salary data is strictly confidential.", "k": "모든 급여 자료는 엄격히 기밀입니다."}, {"w": "distribute", "m": "배포하다", "e": "Please distribute the handouts to the guests.", "k": "손님들에게 자료를 배포해 주세요."}, {"w": "summarize", "m": "요약하다", "e": "Could you summarize the results in one page?", "k": "결과를 한 페이지로 요약해 주시겠어요?"}, {"w": "clarify", "m": "명확히 하다", "e": "Let me clarify the terms of the agreement.", "k": "계약 조건을 명확히 하겠습니다."}, {"w": "discuss", "m": "논의하다", "e": "We will discuss the budget this afternoon.", "k": "우리는 오늘 오후에 예산을 논의할 것입니다."}, {"w": "agree", "m": "동의하다", "e": "Both sides agree on the delivery date.", "k": "양측은 배송 날짜에 동의합니다."}, {"w": "suggestion", "m": "제안", "e": "Her suggestion improved the whole process.", "k": "그녀의 제안이 전체 과정을 개선했습니다."}, {"w": "proposal", "m": "제안서", "e": "The client accepted our project proposal.", "k": "고객이 우리 프로젝트 제안서를 수락했습니다."}, {"w": "deadline", "m": "기한", "e": "The deadline for the draft is Monday morning.", "k": "초안 기한은 월요일 오전입니다."}, {"w": "submit", "m": "제출하다", "e": "Please submit your expense report by Friday.", "k": "금요일까지 경비 보고서를 제출해 주세요."}, {"w": "revise", "m": "수정하다", "e": "We need to revise the slides before the demo.", "k": "시연 전에 슬라이드를 수정해야 합니다."}, {"w": "draft", "m": "초안", "e": "Send me a draft of the contract today.", "k": "오늘 계약서 초안을 보내 주세요."}, {"w": "handout", "m": "배포 자료", "e": "The handout explains each step clearly.", "k": "배포 자료는 각 단계를 명확히 설명합니다."}, {"w": "venue", "m": "장소", "e": "The venue for the workshop has const START='2026-08-24';
const KEY='olivia-toeic-990-long-v1';
const BANK_KEY='olivia-toeic-990-bank-v1';
const DICT_URL='https://raw.githubusercontent.com/jhseo1211/open-english-korean-dict/main/dict/words.json';
let state=loadState(), BANK=[], TODAY=[], idx=0, revealed={}, wordSpeakCount={}, sentenceSpeakCount={}, quizIndex=0, quizScore=0, activeLookup='';

function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{done:[],stars:[],wrong:[],seen:{}}}catch(e){return{done:[],stars:[],wrong:[],seen:{}}}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function dateKR(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dayNum(){const a=new Date(START+'T00:00:00Z'),b=new Date(dateKR()+'T00:00:00Z');return Math.max(1,Math.floor((b-a)/86400000)+1)}
function levelForDay(n){if(n<=100)return['750 목표 구간','기초·중급 핵심 어휘'];if(n<=200)return['850 목표 구간','중급·상급 업무 어휘'];if(n<=300)return['900 목표 구간','고급 독해·청취 어휘'];return['950+ 목표 구간','고난도 어휘·표현']}
function seeded(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function normalizePos(p){p=(p||'').toLowerCase();if(p.includes('verb'))return'verb';if(p.includes('adj'))return'adjective';if(p.includes('adv'))return'adverb';return'noun'}
function practiceSentence(w){
 if(w.e)return w.e;
 const x=w.w;
 const p=normalizePos(w.pos);
 if(p==='verb')return `Practice using "${x}" in a short workplace sentence.`;
 if(p==='adjective')return `Describe a workplace situation using the word "${x}".`;
 if(p==='adverb')return `Make a clear sentence using the word "${x}".`;
 return `Use the word "${x}" in a sentence about work or daily life.`;
}
function practiceKorean(w){return w.k||'이 문장은 해당 단어를 직접 사용해 말해 보는 연습용 문장입니다.'}
function tierScore(entry){
 const cefr=(entry.cefr||'B1').toUpperCase(), rank=Number(entry.freq_rank)||99999;
 const c={A1:0,A2:1,B1:2,B2:3,C1:4,C2:5}[cefr]??2;
 return c*100000+Math.min(rank,99999);
}
async function buildBank(){
 try{
   const cached=JSON.parse(localStorage.getItem(BANK_KEY)||'null');
   if(cached&&cached.length===2000){BANK=cached;ready(false);return}
 }catch(e){}
 try{
   const res=await fetch(DICT_URL,{cache:'force-cache'});
   if(!res.ok)throw new Error('dictionary fetch failed');
   const d=await res.json();
   const curatedSet=new Set(CURATED.map(x=>x.w.toLowerCase()));
   let arr=Object.entries(d).map(([word,v])=>({
      w:word,m:v.meaning_ko||'',ipa:v.ipa||'',pos:v.pos||'',cefr:v.cefr||'B1',freq_rank:v.freq_rank||99999,source:'open-dict'
   })).filter(x=>/^[A-Za-z][A-Za-z '-]{1,28}$/.test(x.w)&&x.m&& !curatedSet.has(x.w.toLowerCase()));
   // Keep useful mainstream vocabulary: A2-C2, reasonably frequent, single words/short expressions.
   arr=arr.filter(x=>['A2','B1','B2','C1','C2'].includes(String(x.cefr).toUpperCase()) && Number(x.freq_rank||99999)<=30000);
   arr.sort((a,b)=>tierScore(a)-tierScore(b));
   // Divide by progressive difficulty rather than blindly taking alphabetical items.
   const groups={
     low:arr.filter(x=>['A2','B1'].includes(String(x.cefr).toUpperCase())),
     mid:arr.filter(x=>['B1','B2'].includes(String(x.cefr).toUpperCase())),
     high:arr.filter(x=>['B2','C1'].includes(String(x.cefr).toUpperCase())),
     top:arr.filter(x=>['C1','C2'].includes(String(x.cefr).toUpperCase()))
   };
   function pickUnique(group,n,used){
      let out=[];for(const x of group){let k=x.w.toLowerCase();if(!used.has(k)){used.add(k);out.push(x);if(out.length>=n)break}}return out
   }
   let used=new Set(CURATED.map(x=>x.w.toLowerCase()));
   let core=CURATED.map(x=>({...x,source:'curated',cefr:'B1',pos:''}));
   // 500 entries per stage. Current curated words are included in stage 1.
   let s1=[...core,...pickUnique(groups.low,500-core.length,used)];
   let s2=pickUnique(groups.mid,500,used);
   let s3=pickUnique(groups.high,500,used);
   let s4=pickUnique(groups.top,500,used);
   // If a higher group is short, fill from remaining dictionary by score.
   let result=[...s1,...s2,...s3,...s4];
   if(result.length<2000) result.push(...pickUnique(arr,2000-result.length,used));
   BANK=result.slice(0,2000).map((x,i)=>({...x,id:i}));
   localStorage.setItem(BANK_KEY,JSON.stringify(BANK));
   ready(false);
 }catch(err){
   BANK=CURATED.map((x,i)=>({...x,id:i,source:'curated'}));
   ready(true);
 }
}
function ready(fallback){

 initDay();
}

}
let voices=[];function refreshVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()||[]}
if('speechSynthesis'in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
function speak(t){if(!('speechSynthesis'in window))return alert('이 브라우저에서는 음성 재생을 지원하지 않습니다.');speechSynthesis.cancel();speechSynthesis.resume();let u=new SpeechSynthesisUtterance(t);let v=voices.find(x=>x.lang==='en-US')||voices.find(x=>/^en/.test(x.lang));if(v)u.voice=v;u.lang=v?.lang||'en-US';u.rate=.87;speechSynthesis.speak(u)}
function star(id){state.stars=state.stars||[];state.stars=state.stars.includes(id)?state.stars.filter(x=>x!==id):[...state.stars,id];saveState();renderWord()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clickable(s){return String(s).split(/(\s+)/).map(t=>{if(/^\s+$/.test(t))return t;let c=t.replace(/^[^A-Za-z]+|[^A-Za-z'-]+$/g,'');if(!c)return esc(t);let p=t.indexOf(c);return esc(t.slice(0,p))+`<span class="wordtoken" onclick="openModal('${c.replace(/'/g,"\\'")}')">${esc(c)}</span>`+esc(t.slice(p+c.length))}).join('')}

function getRecognition(){return window.SpeechRecognition||window.webkitSpeechRecognition||null;}
function normSpeech(s){return String(s||'').toLowerCase().replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim();}
function practiceWordSpeaking(){
 const target=TODAY[idx]?.w||''; const R=getRecognition();
 if(!R){speak(target);wordSpeakCount[idx]=Math.min(3,(wordSpeakCount[idx]||0)+1);renderWord();setTimeout(()=>{let e=document.getElementById('wordMicStatus');if(e)e.textContent='음성인식 미지원: 수동 말하기 횟수로 기록했어요.'},30);return;}
 const r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
 let el=document.getElementById('wordMicStatus');if(el)el.textContent='🎤 듣고 있어요. 단어를 영어로 말해 주세요.';
 r.onresult=e=>{let g=[...e.results[0]].map(x=>normSpeech(x.transcript)),t=normSpeech(target),ok=g.some(x=>x===t||x.includes(t)||t.includes(x));if(ok){wordSpeakCount[idx]=Math.min(3,(wordSpeakCount[idx]||0)+1);renderWord();setTimeout(()=>{let z=document.getElementById('wordMicStatus');if(z)z.textContent='✅ 인식 성공 · '+(wordSpeakCount[idx]||0)+'/3'},30)}else if(el)el.textContent='다시 말해보세요. 인식: '+(g[0]||'');};
 r.onerror=()=>{speak(target);wordSpeakCount[idx]=Math.min(3,(wordSpeakCount[idx]||0)+1);renderWord();};
 try{r.start()}catch(e){speak(target);wordSpeakCount[idx]=Math.min(3,(wordSpeakCount[idx]||0)+1);renderWord();}
}
function practiceSentenceSpeaking(){
 const target=practiceSentence(TODAY[idx]); const R=getRecognition();
 if(!R){speak(target);sentenceSpeakCount[idx]=Math.min(3,(sentenceSpeakCount[idx]||0)+1);renderWord();setTimeout(()=>{let e=document.getElementById('sentenceMicStatus');if(e)e.textContent='문장 음성인식 미지원: 수동 말하기 횟수로 기록했어요.'},30);return;}
 const r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
 let el=document.getElementById('sentenceMicStatus');if(el)el.textContent='🎤 듣고 있어요. 문장을 따라 말해 주세요.';
 r.onresult=e=>{let guess=normSpeech(e.results[0][0].transcript),t=normSpeech(target),tw=t.split(' ').filter(Boolean),gw=new Set(guess.split(' ').filter(Boolean)),ratio=tw.length?tw.filter(w=>gw.has(w)).length/tw.length:0;if(ratio>=0.6){sentenceSpeakCount[idx]=Math.min(3,(sentenceSpeakCount[idx]||0)+1);renderWord();setTimeout(()=>{let z=document.getElementById('sentenceMicStatus');if(z)z.textContent='✅ 문장 인식 성공 · '+(sentenceSpeakCount[idx]||0)+'/3'},30)}else if(el)el.textContent='조금 더 천천히 다시 말해보세요. 인식: '+guess;};
 r.onerror=()=>{speak(target);sentenceSpeakCount[idx]=Math.min(3,(sentenceSpeakCount[idx]||0)+1);renderWord();};
 try{r.start()}catch(e){speak(target);sentenceSpeakCount[idx]=Math.min(3,(sentenceSpeakCount[idx]||0)+1);renderWord();}
}

function renderWord(){
 const w=TODAY[idx], starred=(state.stars||[]).includes(w.id), e=practiceSentence(w);
 document.getElementById('dayLabel').textContent=`DAY ${dayNum()} · 신규 5단어 · ${idx+1}/5`;
 document.getElementById('bar').style.width=((idx+1)*20)+'%';
 document.getElementById('wordArea').innerHTML=`
 <div class="wordrow"><div><div class="word">${esc(w.w)}</div><div class="meta">${w.ipa?esc(w.ipa)+' · ':''}${w.cefr?esc(w.cefr):''}${w.source==='curated'?' · TOEIC 핵심':''}</div></div><button class="star" onclick="star(${w.id})">${starred?'⭐':'☆'}</button></div>
 <button class="btn primary" onclick="speak(TODAY[idx].w)">🔊 단어 듣기</button>
 <button class="btn green" onclick="practiceWordSpeaking()">🎤 단어 3번 말하기 · ${wordSpeakCount[idx]||0}/3 ${(wordSpeakCount[idx]||0)>=3?'🎉':''}</button><div id="wordMicStatus" class="micstatus">버튼을 누른 뒤 영어로 말해보세요.</div>
 ${revealed[idx]?`<div class="meaning"><b>🇰🇷 ${esc(w.m)}</b><div class="example"><div>${clickable(e)}</div><button class="btn soft" onclick="speak(practiceSentence(TODAY[idx]))">🔊 ${w.e?'예문':'연습 문장'} 듣기</button><div class="ko">${esc(practiceKorean(w))}</div>${w.source!=='curated'?`<button class="btn" onclick="activeLookup=${JSON.stringify(w.w)};naverDict()">📘 사전에서 실제 예문 보기</button>`:''}</div><div class="speakbox"><b>🗣️ 매일 말하기</b><div class="small">${w.e?'예문을':'연습 문장을'} 듣고 3번 따라 말하세요.</div><button class="btn green" onclick="practiceSentenceSpeaking()">🎤 문장 3번 말하기 · ${sentenceSpeakCount[idx]||0}/3 ${(sentenceSpeakCount[idx]||0)>=3?'🎉':''}</button><div id="sentenceMicStatus" class="micstatus">예문을 듣고 버튼을 누른 뒤 따라 말해보세요.</div></div></div>`:`<button class="btn soft" onclick="revealed[${idx}]=true;renderWord()">뜻 보기 👀</button>`}
 <div class="nav"><button class="btn" ${idx===0?'disabled':''} onclick="idx--;renderWord()">← 이전</button><button class="btn primary" onclick="${idx<4?'idx++;renderWord()':'startQuiz()'}">${idx<4?'다음 →':'퀴즈 →'}</button></div>`;
}
function reviewIds(){
 let ids=[...new Set([...(state.wrong||[]),...(state.stars||[])])].filter(x=>BANK[x]);
 // Add spaced reviews from 1,3,7,14 days ago.
 const today=new Date(dateKR()+'T00:00:00Z');
 Object.entries(state.seen||{}).forEach(([id,ds])=>{let d=new Date(ds+'T00:00:00Z');let gap=Math.round((today-d)/86400000);if([1,3,7,14].includes(gap)&&BANK[id])ids.push(Number(id))});
 return [...new Set(ids)].filter(id=>!TODAY.some(x=>x.id===id)).slice(0,5);
}
function renderDailyReview(){let ids=reviewIds(),box=document.getElementById('dailyReviewCard');if(!ids.length){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML=`<div class="reviewtitle">🔁 오늘의 자동 복습 ${ids.length}개</div><div class="small">오답·⭐·1/3/7/14일 전 단어를 우선 복습합니다.</div>${ids.map(id=>`<div class="reviewItem"><div><b>${esc(BANK[id].w)}</b><div class="small">${esc(BANK[id].m)}</div></div><button class="star" onclick='speak(${JSON.stringify(BANK[id].w)})'>🔊</button></div>`).join('')}`}
function shuffle(a,seed){let r=seeded(seed),x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startQuiz(){quizIndex=0;quizScore=0;document.getElementById('learnCard').classList.add('hidden');document.getElementById('dailyReviewCard').classList.add('hidden');document.getElementById('quizCard').classList.remove('hidden');renderQuiz()}
function renderQuiz(){let b=document.getElementById('quizCard');if(quizIndex>=5){b.innerHTML=`<h2>🎉 ${quizScore}/5</h2><p>틀린 단어는 자동 복습 대상에 저장됩니다.</p><button class="btn primary" onclick="finishDay()">학습 완료 ✓</button>`;return}let w=TODAY[quizIndex],other=BANK.filter(x=>x.id!==w.id).map(x=>x.m),opts=shuffle([w.m,...shuffle(other,dayNum()*71+quizIndex).slice(0,3)],dayNum()*97+quizIndex);b.innerHTML=`<div class="day">QUIZ ${quizIndex+1}/5</div><h3>“${esc(w.w)}”의 뜻은?</h3>${opts.map(o=>`<button class="choice" onclick='answer(${JSON.stringify(o)},this)'>${esc(o)}</button>`).join('')}`}
function answer(o,el){let w=TODAY[quizIndex],ok=o===w.m;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(ok?'ok':'bad');if(ok)quizScore++;else{state.wrong=[...new Set([...(state.wrong||[]),w.id])];saveState()}setTimeout(()=>{quizIndex++;renderQuiz()},600)}
function finishDay(){state.done=[...new Set([...(state.done||[]),dateKR()])];saveState();updateStreak();document.getElementById('quizCard').innerHTML=`<h2>✅ 오늘 학습 완료</h2><p>내일은 다음 5개 신규 단어와 자동 복습이 준비됩니다.</p><button class="btn" onclick="location.reload()">오늘 단어 다시 보기</button>`}
function streak(){let s=new Set(state.done||[]),d=new Date(dateKR()+'T00:00:00Z'),n=0;if(!s.has(dateKR()))d.setUTCDate(d.getUTCDate()-1);while(s.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function updateStreak(){document.getElementById('streak').textContent='🔥 '+streak()+'일'}
function renderReview(){let ids=[...new Set([...(state.wrong||[]),...(state.stars||[])])].filter(x=>BANK[x]);let e=document.getElementById('reviewList');e.innerHTML=ids.length?ids.map(id=>`<div class="reviewItem"><div><b>${esc(BANK[id].w)}</b><div class="small">${esc(BANK[id].m)}</div></div><button class="star" onclick='speak(${JSON.stringify(BANK[id].w)})'>🔊</button></div>`).join(''):'<p class="small">아직 저장된 복습 단어가 없습니다.</p>'}
function renderHistory(){document.getElementById('historySummary').innerHTML=`<p><b>총 학습일</b> ${(state.done||[]).length}일 · <b>연속</b> ${streak()}일 · <b>학습한 단어</b> ${Object.keys(state.seen||{}).length}개</p>`;let base=new Date(dateKR()+'T00:00:00Z'),done=new Set(state.done||[]),a=[];for(let i=6;i>=0;i--){let d=new Date(base);d.setUTCDate(d.getUTCDate()-i);let s=d.toISOString().slice(0,10);a.push(`<div class="d ${done.has(s)?'done':''}">${d.getUTCMonth()+1}/${d.getUTCDate()}<br>${done.has(s)?'✓':'·'}</div>`)}document.getElementById('history7').innerHTML=a.join('')}
function openModal(w){activeLookup=w;document.getElementById('modalWord').textContent=w;document.getElementById('wordModal').classList.remove('hidden')}
function closeModal(){document.getElementById('wordModal').classList.add('hidden')}
function naverDict(){if(activeLookup)window.open('https://en.dict.naver.com/#/search?query='+encodeURIComponent(activeLookup),'_blank','noopener')}
function googleSearch(){if(activeLookup)window.open('https://www.google.com/search?q='+encodeURIComponent(activeLookup+' meaning pronunciation'),'_blank','noopener')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['learn','review','history'].forEach(p=>document.getElementById(p+'Page').classList.toggle('hidden',p!==b.dataset.page));if(b.dataset.page==='review')renderReview();if(b.dataset.page==='history')renderHistory()});
buildBank();
</script>
</body></html>
